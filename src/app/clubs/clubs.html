<div class="mx-auto flex w-full max-w-3xl flex-col gap-5 px-4 py-6">
  <div class="flex flex-row items-center justify-between">
    <h1 class="text-2xl font-semibold">Clubs</h1>
    <p-button
      label="Matches"
      icon="pi pi-list"
      severity="secondary"
      [outlined]="true"
      (onClick)="navigateToMatches()"
    />
  </div>

  @if (error()) {
    <p-message severity="error" [text]="error()" />
  }

  <p-card>
    <ng-template #title>{{ editingId() ? 'Edit club' : 'New club' }}</ng-template>

    <form (submit)="save(); $event.preventDefault()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="club-name" class="text-sm font-medium">Name</label>
        <input id="club-name" pInputText [formField]="clubForm.name" class="w-full" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="club-country" class="text-sm font-medium">Country</label>
        <input id="club-country" pInputText [formField]="clubForm.country" class="w-full" />
      </div>

      <div class="flex flex-row gap-2">
        <p-button
          type="submit"
          [label]="editingId() ? 'Update' : 'Create'"
          [icon]="editingId() ? 'pi pi-check' : 'pi pi-plus'"
          [disabled]="clubForm().invalid()"
        />
        @if (editingId()) {
          <p-button
            type="button"
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            [text]="true"
            (onClick)="cancel()"
          />
        }
      </div>
    </form>
  </p-card>

  <p-table
    [value]="clubs.value()"
    [loading]="clubs.isLoading()"
    [tableStyle]="{ 'min-width': '100%' }"
    size="small"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Country</th>
        <th scope="col" class="w-28 text-right">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-club>
      <tr>
        <td>{{ club.name }}</td>
        <td>{{ club.country }}</td>
        <td class="text-right">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            ariaLabel="Edit {{ club.name }}"
            (onClick)="edit(club)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            ariaLabel="Delete {{ club.name }}"
            (onClick)="remove(club.id)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="py-6 text-center">No clubs yet.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
