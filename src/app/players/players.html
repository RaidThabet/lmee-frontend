<div class="mx-auto flex w-full max-w-3xl flex-col gap-5 px-4 py-6">
  <div class="flex flex-row items-center justify-between">
    <h1 class="text-2xl font-semibold">Players</h1>
    <p-button
      label="Matches"
      icon="pi pi-list"
      severity="secondary"
      [outlined]="true"
      (onClick)="navigateToMatches()"
    />
  </div>

  @if (error()) {
    <p-message severity="error" [text]="error()" />
  }

  <p-card>
    <ng-template #title>{{ editingId() ? 'Edit player' : 'New player' }}</ng-template>

    <form (submit)="save(); $event.preventDefault()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="player-name" class="text-sm font-medium">Name</label>
        <input id="player-name" pInputText [formField]="playerForm.name" class="w-full" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="player-club" class="text-sm font-medium">Club</label>
        <select id="player-club" pInputText [formField]="playerForm.club" class="w-full">
          <option value="">Select a club</option>
          @for (club of clubs.value(); track club.id) {
            <option [value]="club.id">{{ club.name }}</option>
          }
        </select>
      </div>

      <div class="flex flex-row gap-2">
        <p-button
          type="submit"
          [label]="editingId() ? 'Update' : 'Create'"
          [icon]="editingId() ? 'pi pi-check' : 'pi pi-plus'"
          [disabled]="playerForm().invalid()"
        />
        @if (editingId()) {
          <p-button
            type="button"
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            [text]="true"
            (onClick)="cancel()"
          />
        }
      </div>
    </form>
  </p-card>

  <p-table
    [value]="players.value()"
    [loading]="players.isLoading()"
    [tableStyle]="{ 'min-width': '100%' }"
    size="small"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Club</th>
        <th scope="col" class="w-28 text-right">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-player>
      <tr>
        <td>{{ player.name }}</td>
        <td>{{ clubName(player.club) }}</td>
        <td class="text-right">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            ariaLabel="Edit {{ player.name }}"
            (onClick)="edit(player)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            ariaLabel="Delete {{ player.name }}"
            (onClick)="remove(player.id)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="py-6 text-center">No players yet.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
