<div class="flex flex-col gap-5 my-5 w-1/3 mx-auto">
  <div class="flex flex-row justify-between items-center">
    <h1 class="text-lg">Players</h1>
    <button
      (click)="navigateToMatches()"
      class="border rounded-md border-stone-800 px-3 cursor-pointer"
    >
      Matches
    </button>
  </div>

  @if (error()) {
    <div role="alert" class="border rounded-md border-red-800 text-red-800 px-3 py-2">
      {{ error() }}
    </div>
  }

  <form
    (submit)="save(); $event.preventDefault()"
    class="flex flex-col gap-2 border rounded-md border-stone-800 p-3"
  >
    <label for="player-name">Name</label>
    <input
      id="player-name"
      [formField]="playerForm.name"
      class="border rounded-md border-stone-800 px-2"
    />

    <label for="player-club">Club</label>
    <select
      id="player-club"
      [formField]="playerForm.club"
      class="border rounded-md border-stone-800 px-2"
    >
      <option value="">Select a club</option>
      @for (club of clubs.value(); track club.id) {
        <option [value]="club.id">{{ club.name }}</option>
      }
    </select>

    <div class="flex flex-row gap-2">
      <button
        type="submit"
        [disabled]="playerForm().invalid()"
        class="border rounded-md border-stone-800 px-3 cursor-pointer disabled:opacity-50"
      >
        {{ editingId() ? 'Update' : 'Create' }}
      </button>
      @if (editingId()) {
        <button
          type="button"
          (click)="cancel()"
          class="border rounded-md border-stone-800 px-3 cursor-pointer"
        >
          Cancel
        </button>
      }
    </div>
  </form>

  @if (players.isLoading()) {
    <div>Loading players...</div>
  }

  @for (player of players.value(); track player.id) {
    <div class="grid grid-cols-3 items-center border rounded-md border-stone-800 px-5">
      <span class="text-left">{{ player.name }}</span>
      <span class="text-center">{{ clubName(player.club) }}</span>
      <div class="flex flex-row gap-3 justify-end">
        <button (click)="edit(player)" class="cursor-pointer">Edit</button>
        <button (click)="remove(player.id)" class="cursor-pointer">Delete</button>
      </div>
    </div>
  }
</div>
