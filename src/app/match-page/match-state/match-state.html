@if (loaded()) {
  <div class="flex flex-col">
    <span>{{ status() }}</span>
    <span>
      {{ homeScore() }} - {{ awayScore() }}
    </span>
  </div>
} @else {
  <div role="status" aria-busy="true" class="flex animate-pulse flex-col items-center gap-2">
    <span class="sr-only">Loading match state…</span>
    <div aria-hidden="true" class="h-4 w-full max-w-16 rounded bg-stone-300"></div>
    <div aria-hidden="true" class="h-6 w-full max-w-20 rounded bg-stone-300"></div>
  </div>
}
