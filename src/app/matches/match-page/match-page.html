@if (matchState.hasValue()) {
  <div class="mx-auto flex w-full max-w-3xl flex-col gap-5 px-4 py-6">
    <p-card>
      <div class="flex flex-row items-center justify-between gap-5">
        <match-side
          [clubName]="matchState.value().homeClubName"
          isHome="true"
          [yellows]="matchState.value().homeYellows"
          [reds]="matchState.value().homeReds"
          [subs]="matchState.value().homeSubs"
        />
        <match-state
          [homeScore]="matchState.value().homeScore"
          [awayScore]="matchState.value().awayScore"
          [status]="matchState.value().status"
        />
        <match-side
          [clubName]="matchState.value().awayClubName"
          isHome="false"
          [yellows]="matchState.value().awayYellows"
          [reds]="matchState.value().awayReds"
          [subs]="matchState.value().awaySubs"
        />
      </div>
    </p-card>

    @if (auth.isOperator()) {
      <p-button label="Add Event" icon="pi pi-plus" styleClass="mx-auto" />
    }

    <p-card>
      <ng-template #title>Timeline</ng-template>
      <ul class="flex flex-col gap-3 list-none">
        @for (event of events(); track event.sequenceNumber) {
          <li>
            <match-event [event]="event" />
          </li>
        } @empty {
          <li class="text-muted-color text-sm">No events yet.</li>
        }
      </ul>
    </p-card>
  </div>
} @else if (matchState.isLoading()) {
  <div
    class="mx-auto flex w-full max-w-3xl flex-col gap-5 px-4 py-6"
    role="status"
    aria-busy="true"
  >
    <span class="sr-only">Loading match page…</span>
    <p-skeleton height="8rem" />
    <p-skeleton height="16rem" />
  </div>
} @else if (matchState.error()) {
  <div class="mx-auto w-full max-w-3xl px-4 py-6">
    <p-message severity="error" text="Unable to load match page." />
  </div>
}
