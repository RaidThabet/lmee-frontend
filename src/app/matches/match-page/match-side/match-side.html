@if (loaded()) {
  <div class="flex flex-col gap-3" [class]="alignClass()">
    <div class="truncate text-lg font-semibold">{{ clubName() }}</div>
    <div class="flex flex-row flex-wrap gap-2">
      <p-tag [value]="'Yellows ' + yellows()" severity="warn" />
      <p-tag [value]="'Reds ' + reds()" severity="danger" />
      <p-tag [value]="'Subs ' + subs()" severity="secondary" />
    </div>
  </div>
} @else {
  <div role="status" aria-busy="true" class="flex flex-col gap-3">
    <span class="sr-only">Loading match side…</span>
    <p-skeleton height="1.5rem" width="60%" />
    <div class="flex flex-row gap-2">
      <p-skeleton height="1.5rem" width="5rem" />
      <p-skeleton height="1.5rem" width="5rem" />
      <p-skeleton height="1.5rem" width="5rem" />
    </div>
  </div>
}
