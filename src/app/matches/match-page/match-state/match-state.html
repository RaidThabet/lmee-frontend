<div class="flex flex-col items-center gap-2">
  <p-tag [value]="statusLabel()" [severity]="statusSeverity()" />
  @if (auth.isOperator() && status() == "SCHEDULED") {
    <span class="text-3xl font-bold tabular-nums">
      <p-button (click)="startMatch()" size="small" label="Start Match" />
    </span>
  } @else {
    <span class="text-3xl font-bold tabular-nums">{{ homeScore() }} - {{ awayScore() }}</span>
  }
</div>
