<button (click)="navigateToMatch(matchId())" class="flex flex-col border rounded-b-md border-stone-800 w-1/3 mx-auto cursor-pointer">
  <span class="flex flex-row justify-center">
    {{ date() }}
  </span>
  <div class="grid grid-cols-3 items-center px-5">
    <span class="text-left">{{ homeClubName() }}</span>
    <div class="flex flex-col items-center">
      <span>{{ time() }}</span>
      <span>{{ status() }}</span>
    </div>
    <span class="text-right">{{ awayClubName() }}</span>
  </div>
</button>
