<p-toolbar styleClass="sticky top-0 z-10 rounded-none border-x-0 border-t-0">
  <ng-template #start>
    @if (auth.isAdmin()) {
      <nav class="flex items-center gap-2" aria-label="Admin">
        <p-button
          label="Clubs"
          icon="pi pi-building"
          severity="secondary"
          [text]="true"
          (onClick)="navigateTo('/clubs')"
        />
        <p-button
          label="Players"
          icon="pi pi-users"
          severity="secondary"
          [text]="true"
          (onClick)="navigateTo('/players')"
        />
      </nav>
    }
  </ng-template>

  <ng-template #end>
    <div class="flex items-center gap-3">
      @if (auth.isAuthenticated()) {
        <span class="text-surface-700 dark:text-surface-200 text-sm">{{ auth.fullName() }}</span>
        <p-button
          label="Log out"
          icon="pi pi-sign-out"
          severity="secondary"
          [outlined]="true"
          (onClick)="auth.logout()"
        />
      } @else {
        <p-button label="Log in" icon="pi pi-sign-in" (onClick)="auth.login()" />
      }
    </div>
  </ng-template>
</p-toolbar>

<router-outlet />
