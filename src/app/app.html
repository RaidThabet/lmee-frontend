<header
  class="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-stone-300 bg-white px-5 py-3"
>
  <nav class="flex items-center gap-3">
    @if (auth.isAdmin()) {
      <button
        type="button"
        (click)="navigateTo('/clubs')"
        class="cursor-pointer rounded-md border border-stone-800 px-3 py-1"
      >
        Clubs
      </button>
      <button
        type="button"
        (click)="navigateTo('/players')"
        class="cursor-pointer rounded-md border border-stone-800 px-3 py-1"
      >
        Players
      </button>
    }
  </nav>

  <div class="flex items-center gap-3">
    @if (auth.isAuthenticated()) {
      <span class="text-stone-800">{{ auth.fullName() }}</span>
      <button
        type="button"
        (click)="auth.logout()"
        class="cursor-pointer rounded-md border border-stone-800 px-3 py-1"
      >
        Log out
      </button>
    } @else {
      <button
        type="button"
        (click)="auth.login()"
        class="cursor-pointer rounded-md border border-stone-800 px-3 py-1"
      >
        Log in
      </button>
    }
  </div>
</header>

<router-outlet />
