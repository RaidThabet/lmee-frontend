<div class="mx-auto flex w-full max-w-3xl flex-col gap-5 px-4 py-6">
  <div class="flex flex-row items-center justify-between">
    <h1 class="text-2xl font-semibold">Players</h1>
    <p-button
      label="Matches"
      icon="pi pi-list"
      severity="secondary"
      [outlined]="true"
      (onClick)="navigateToMatches()"
    />
  </div>

  @if (error()) {
    <p-message severity="error" [text]="error()" />
  }

  <p-card>
    <ng-template #title>Mark a club as favourite</ng-template>

    <form (submit)="save(); $event.preventDefault()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="player-club" class="text-sm font-medium">Club</label>
        <select id="player-club" pInputText [formField]="userClubForm.clubId" class="w-full">
          <option value="">Select a club</option>
          @for (club of clubs.value(); track club.id) {
            <option [value]="club.id">{{ club.name }}</option>
          }
        </select>
      </div>

      <div class="flex flex-row gap-2">
        <p-button
          type="submit"
          label="Add"
          icon="pi pi-plus"
          [disabled]="userClubForm().invalid()"
        />
      </div>
    </form>
  </p-card>

  <p-table
    [value]="userFavouriteClubs.value()"
    [loading]="userFavouriteClubs.isLoading()"
    [tableStyle]="{ 'min-width': '100%' }"
    size="small"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Club</th>
        <th scope="col" class="w-28 text-right">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-club>
      <tr>
        <td>{{ club.name }}</td>
        <td class="text-right">
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            ariaLabel="Delete {{ club.name }}"
            (onClick)="remove(club.id)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="py-6 text-center">No favourite clubs yet.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
